a coexist in open formats (Parquet + Delta); supports ACID, versioning, and fast queries. ✅ Real-World Use Case: Unified Analytics Platform Databricks Lakehouse stores: Product clickstream logs CRM structured data Images of products Enables: BI reporting (Power BI) ML model training (PySpark, MLlib) Streaming insights (Structured Streaming) 🔁 When to Use What? Use Case Best Fit Daily transactions &amp; updates Database Historical business reporting Data Warehouse Storing raw, multi-format data Data Lake Unified platform (BI + AI/ML) Data Lakehouse OLTP (Online Transaction Processing) vs OLAP (Online Analytical Processing): 🔹 OLTP vs OLAP – Summary Table" src="./1753755501432(7)"></li><li class="carousel-slide carousel-slide-active" data-ssplayer-slide-index="8" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait carousel-element-loaded carousel-element-load-success" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/9/1753755501432?e=1754524800&amp;v=beta&amp;t=fGrhTyJqBsdy2-wiiudkRzKqt5JnthNp48jD4AAVBt0" alt="Feature OLTP (Online Transaction Processing) OLAP (Online Analytical Processing) Purpose Handle day-to-day transactions Analyze historical data and support decisions Operation Type Insert, Update, Delete, Simple Read Complex Queries, Aggregations Data Type Real-time, current data Historical, aggregated data Users Customers, front-end apps Analysts, managers, BI tools Query Type Short and simple (fast) Long, complex queries Tables Design Normalized (to reduce redundancy) Denormalized (for faster query performance) Transactions Highly concurrent, ACID- compliant Read-heavy, less frequent updates Performance Focus Speed of write and transaction integrity Speed of query and aggregation Examples Banking, e-commerce apps Sales trends, customer insights 🔸 OLTP Example: E-commerce Website 💼 Scenario: User visits an online shopping site and places an order. 🔄 OLTP Actions: Insert a new order into orders table. Update inventory to reduce item count. Update user account with purchase history. All of this must happen quickly and reliably. 🔧 Tools Used:" src="./1753755501432(8)"></li><li class="carousel-slide" data-ssplayer-slide-index="9" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait carousel-element-loaded carousel-element-load-success" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/10/1753755501432?e=1754524800&amp;v=beta&amp;t=6UxVVUjz5-EetOmlFg9U5nknR_ax1xOb8CIgtJeNxfo" alt="Databases: MySQL, PostgreSQL, Oracle DB, SQL Server. 🔹 OLAP Example: Sales Dashboard 📊 Scenario: Business analyst wants to analyze monthly sales by region over the last 5 years. 🔄 OLAP Actions: Query data warehouse to aggregate total sales by region &amp; time. Join with marketing data to find correlation. Build interactive dashboards with filters for product, time, and region. 🔧 Tools Used: Data Warehouses: Snowflake, Redshift, BigQuery. BI Tools: Power BI, Tableau, Looker. 🔁 Quick Analogy: Analogy Type OLTP OLAP Supermarket Billing counter (scan items, checkout fast) Back office (analyze top- selling items by category) Banking Withdraw ₹100 from ATM Generate report of all withdrawals in June Healthcare Register new patient, update prescription Analyze patient recovery trends by treatment 🧠 Tip: Use OLTP for real-time apps (CRUD-heavy). Use OLAP for insights and decisions (query-heavy). 📌 What is Dimensional Modeling? Dimensional Modeling is a data design technique used to structure data in a way that’s optimized for querying and reporting — especially in data warehouses." src="./1753755501432(9)"></li><li class="carousel-slide" data-ssplayer-slide-index="10" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait carousel-element-loaded carousel-element-load-success" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/11/1753755501432?e=1754524800&amp;v=beta&amp;t=Wkbnpb8YKO9I7Jwju6gIS9HoTjPBic6nt81VPus0Jtw" alt="It focuses on making data easy to understand, fast to retrieve, and flexible for analysis by organizing it into facts and dimensions. 🔷 Key Components 1. Fact Table Central table that contains measurable, quantitative data. Stores metrics or facts (e.g., sales amount, revenue, quantity). Has foreign keys to dimension tables. 2. Dimension Tables Contain descriptive attributes related to facts. Answer &quot;who, what, when, where, how&quot;. Examples: Customer, Product, Time, Region. 📊 Dimensional Model Example – Retail Sales 💡 Business Case: A retail company wants to analyze sales by product, store, and time. ⭐ Fact Table: Sales_Fact Sales_ID Date_ID Product_ID Store_ID Quantity Sales_Amount 1 20240725 101 201 2 500.00 📁 Dimension Tables 📅 Date_Dim Date_ID Date Month Quarter Year 20240725 2024-07-25 July Q3 2024 📦 Product_Dim" src="./1753755501432(10)"></li><li class="carousel-slide" data-ssplayer-slide-index="11" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait carousel-element-loaded carousel-element-load-success" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/12/1753755501432?e=1754524800&amp;v=beta&amp;t=tfVlKyfCmDOhmtqOgM9QHK8KEglztR7wPPAsug23B_8" alt="Product_ID Product_Name Category Brand 101 iPhone 15 Electronics Apple 🏬 Store_Dim Store_ID Store_Name City Region 201 SuperMart Hyderabad South India 🧱 Dimensional Modeling Architectures 1. Star Schema Central fact table connects to dimension tables directly. Simple and fast for queries. Product_Dim | Time_Dim — Sales_Fact — Store_Dim | Date_Dim 2. Snowflake Schema Normalized dimensions (dimension tables have sub-dimensions). More complex, but reduces redundancy. Product_Category_Dim | Product_Dim | Sales_Fact |" src="./1753755501432(11)"></li><li class="carousel-slide" data-ssplayer-slide-index="12" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait carousel-element-loaded carousel-element-load-success" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/13/1753755501432?e=1754524800&amp;v=beta&amp;t=HkMxQE_zfaJq8jrT8QBJbtkSAh22rpZvBzFH-y5R_iI" alt="1.  2.  3.  4.  Store_Dim — Region_Dim | Time_Dim 🧠 Benefits of Dimensional Modeling Feature Benefit Simplicity Easy for analysts to understand Query Performance Optimized for fast aggregations Extensibility Easy to add new facts or dimensions Integration Friendly Works well with OLAP &amp; BI tools ✅ Use Cases Sales &amp; Revenue Reporting Inventory Analysis Customer Segmentation Web Analytics Financial Forecasting 🔄 Steps to Design a Dimensional Model (Kimball Method) Identify Business Process – e.g., “Track sales transactions” Declare Grain – e.g., “Each sale at the product level per day” Identify Dimensions – e.g., Product, Customer, Time, Store Identify Facts – e.g., Quantity sold, Revenue, Discount 🧭 When to Use Dimensional Modeling? Use it when: You&#39;re building a data warehouse or BI system Users need to perform slice &amp; dice, roll-up, drill-down You want to separate metrics from descriptive data Operational Data Store (ODS) and Data Mart:" src="./1753755501432(12)"></li><li class="carousel-slide" data-ssplayer-slide-index="13" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/14/1753755501432?e=1754524800&amp;v=beta&amp;t=kZFNII528VJMcXLMX2yJY--WanQ0hrdtdPX8H6RMwVE" alt="✅ 1. Operational Data Store (ODS) 📌 Definition: An Operational Data Store is a centralized database that integrates data from multiple sources and provides a near real-time, consolidated view of operational data. It is mainly used for operational reporting and short-term decisions, not for long-term historical analysis. 🔍 Key Characteristics: Supports real-time or near real-time updates Stores current or recent transactional data Acts as a staging area between OLTP systems and a Data Warehouse Designed for low-latency access and frequent updates 🏗️ Architecture Use Case: ODS often sits between OLTP systems (like ERP, CRM) and a Data Warehouse: OLTP Systems → ODS → Data Warehouse → BI Tools 📊 Example Scenario: A retail company wants to track the current inventory across all stores in real time. Data comes from: POS systems, warehouse systems, and online orders ODS consolidates this real-time data Store managers use the ODS to make immediate decisions on restocking ❗ Example Query from ODS: &quot;Show current stock of Item X across all warehouses and stores.&quot; ✅ 2. Data Mart 📌 Definition: A Data Mart is a subset of a Data Warehouse, focused on a specific business line or department, like sales, finance, or HR. It is designed for analytical or decision support purposes for a particular group. 🔍 Key Characteristics: Subject-area oriented (e.g., Sales Mart, HR Mart) Optimized for OLAP (Online Analytical Processing) Usually contains historical data Data is often summarized or aggregated Built from the enterprise Data Warehouse or directly from source systems"></li><li class="carousel-slide" data-ssplayer-slide-index="14" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/15/1753755501432?e=1754524800&amp;v=beta&amp;t=O1qUxuoNCM30IFYWyWXjiUXRswwIG4mzLFmpJzqDWLo" alt="1.  2.  3.  🏗️ Types of Data Marts: Dependent: Built from the central Data Warehouse Independent: Built directly from source systems Hybrid: Combines both approaches 📊 Example Scenario: A sales team in a company wants to analyze monthly sales trends. The Data Mart contains: product sales, region-wise sales, customer segments Source data is loaded from the central Data Warehouse or ODS Analysts run OLAP queries for reporting and dashboarding ❗ Example Query from Data Mart: &quot;Show total sales for Q2 2025 grouped by product category and region.&quot; 🆚 ODS vs Data Mart – Quick Comparison Table Feature Operational Data Store (ODS) Data Mart Purpose Real-time operational reporting Analytical/reporting for a department Data Latency Near real-time Batch loaded (daily, weekly) Data Type Current transactional data Historical, aggregated data Users Operational staff Business analysts, executives Update Frequency Continuous Periodic (ETL jobs) Storage Duration Short term Long term Design Focus Fast updates &amp; low latency Fast query performance &amp; analytics ✅ Summary with Example Suppose you&#39;re working in a bank:"></li><li class="carousel-slide" data-ssplayer-slide-index="15" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/16/1753755501432?e=1754524800&amp;v=beta&amp;t=9ym_0BRv2jcd8ZTRr2xfhys1eNRR7iIeNiq8FFqy1F4" alt="The ODS is used by branch managers to monitor today’s transactions like deposits, withdrawals, etc. The Data Mart is used by the finance department to analyze last year’s loan performance per region and product type. Real-World use case of ODS and Data Mart: ✅ 1. Operational Data Store (ODS) 🔧 Architecture Diagram: [CRM System] [ERP System] [POS System] │ │ │ └──────────► [Operational Data Store (ODS)] ◄──────────┐ │ │ Real-time Reporting Feeds DW ▼ [Operational Dashboard] 💡 Use Case: Retail Inventory Monitoring A retail company wants to monitor real-time stock levels and customer orders. 🗂️ ODS Table Example: ods_inventory SELECT store_id, item_id, quantity_in_stock FROM ods_inventory WHERE item_id = &#39;SKU12345&#39;; ⏱ This query gives current stock availability of a product across all stores — critical for real- time operations. ✅ 2. Data Mart 🔧 Architecture Diagram: [Data Warehouse] │"></li><li class="carousel-slide" data-ssplayer-slide-index="16" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/17/1753755501432?e=1754524800&amp;v=beta&amp;t=by7uoIgP9ZJ02D4ZuJe_9Tv6S4ckVF-vfA6SSaT7T1U" alt="┌────────────┴────────────┐ ▼ ▼ [Sales Data Mart] [Finance Data Mart] │ │ Aggregated Aggregated Data Data ▼ ▼ [Sales Dashboards] [Finance Dashboards] 💡 Use Case: Sales Trend Analysis The sales team wants to analyze monthly revenue trends and top-selling products. 🗂️ Sales Mart Table Example: sales_summary_mart SELECT product_category, SUM(sales_amount) AS total_sales FROM sales_summary_mart WHERE sale_month BETWEEN &#39;2025-01&#39; AND &#39;2025-06&#39; GROUP BY product_category ORDER BY total_sales DESC; 📊 This query supports strategic decision-making, like which products to promote or discontinue. 🆚 ODS vs Data Mart – Real-World Comparison Table"></li><li class="carousel-slide" data-ssplayer-slide-index="17" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/18/1753755501432?e=1754524800&amp;v=beta&amp;t=cK1ZoYqyItQbTJBl0NyHzpULY3L6Jb3LtXJMfOHGqnw" alt="Feature ODS (Operational Data Store) Data Mart (e.g., Sales/Finance Mart) Used By Operations team Business analysts, managers Data Type Current, detailed, real-time data Historical, summarized, analytical data Update Frequency Near real-time (streaming or micro-batch) Daily/weekly ETL pipelines Purpose Day-to-day operations Long-term business intelligence Example System Inventory management, fraud detection Sales forecasting, financial reporting Tech Used NoSQL, RDBMS, CDC tools (e.g., Debezium) OLAP tools, star/snowflake schema 📌 Summary Flow: [OLTP Systems] ───► [ODS] ───► [Data Warehouse] ───► [Data Marts] ───► [BI/Reports] (Real-time) (Current Ops) (Central Repo) (Dept-Specific Analytics) Let me know if you&#39;d like: A Star Schema for the Data Mart 📐 How ODS fits into a lambda or kappa architecture 🔁 Real-time ingestion examples using Kafka + ODS or ETL pipelines How ODS fits into modern architecture like Lambda Architecture using Kafka + ETL. We’ll use retail as the domain for clarity: 🏪 DOMAIN: Retail Industry ✅ 1. Operational Data Store (ODS) in Retail"></li><li class="carousel-slide" data-ssplayer-slide-index="18" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/19/1753755501432?e=1754524800&amp;v=beta&amp;t=3GGR-qInrYj7wLtoYEpapfZVgLxICv4YU2cshm1NsYo" alt="🔍 Use Case: A retail company wants to track real-time transactions, inventory, and order status across all its stores and online channels. 💡 Example Scenarios: Store manager checks current stock levels of an item Customer support checks real-time order status Fraud detection engine monitors real-time purchases 📘 ODS Tables: ods_sales_transactions ods_inventory_status ods_customer_orders 🧾 Example Query: SELECT order_id, status, last_updated_time FROM ods_customer_orders WHERE customer_id = &#39;CUST98765&#39;; 🔄 This gives latest status of customer orders — useful for support agents. 🔁 Data Flow with Kafka: POS/Online System → Kafka → ODS (Streaming via Kafka Connect / Spark Streaming) ✅ 2. Data Mart in Retail (Sales Mart) 🔍 Use Case: The Sales Department wants to analyze: Revenue by region Top-selling products monthly Year-over-Year sales comparison 🌟 Star Schema for Sales Data Mart 📘 Fact Table: fact_sales: Contains measurable metrics like quantity sold, total amount, etc. 📗 Dimension Tables: dim_date: Date details dim_store: Store location, region"></li><li class="carousel-slide" data-ssplayer-slide-index="19" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/20/1753755501432?e=1754524800&amp;v=beta&amp;t=jlxtb035AOSbKyBNDq2B1i_2dnBkh5tuGtWHMNm9mjA" alt="dim_product: Product category, brand dim_customer: Customer demographics [dim_date] ▲ │ [dim_store] ◄── [fact_sales] ──► [dim_product] │ ▼ [dim_customer] 📊 Example Query: SELECT d.month, p.category, SUM(f.sales_amount) AS revenue FROM fact_sales f JOIN dim_date d ON f.date_id = d.date_id JOIN dim_product p ON f.product_id = p.product_id WHERE d.year = 2025 GROUP BY d.month, p.category ORDER BY revenue DESC; 📈 This helps executives make data-driven marketing decisions. 🔀 Modern Architecture: ODS in Lambda Architecture ⚙️ Components: Batch Layer → Data Warehouse (historical data) Speed Layer → ODS (real-time data) Serving Layer → Data Marts (query ready data) ┌────────────┐ │ OLTP Apps │ └────┬───────┘ ▼ ┌──────────────────────┐"></li><li class="carousel-slide" data-ssplayer-slide-index="20" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/21/1753755501432?e=1754524800&amp;v=beta&amp;t=2beI9lfLp0uR4hRF1cAaYuO9vTAIJ02t8qN2ztjhNnw" alt="│ Real-time Stream (Kafka) │ └─────────┬────────────┘ ▼ ┌────────────────┐ │ ODS (Speed Layer) │◄── Real-time dashboards └────────┬───────┘ ▼ ┌────────────────────┐ │ Data Warehouse │ (Batch Layer) └────────┬───────────┘ ▼ ┌────────────────────┐ │ Data Marts │ (Serving Layer) └────────────────────┘ 🧠 Final Summary Feature ODS (Speed Layer) Data Mart (Serving Layer) Focus Operational monitoring Strategic decision making Latency Real-time / near real-time Hourly/daily (batch) Users Store managers, customer support Business analysts, marketing teams Data Example Current inventory, real- time sales Monthly sales by product and region Tools Kafka, Spark Streaming, PostgreSQL, MongoDB Hive, Presto, Redshift, BigQuery, Snowflake"></li><li class="carousel-slide" data-ssplayer-slide-index="21" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/22/1753755501432?e=1754524800&amp;v=beta&amp;t=fWJz7meCKX3i9GE5ft37xxw8vmcePYmAzVXA1-E60vg" alt="1.  2.  3.  Let&#39;s now explore a complete Kafka → ODS → Data Warehouse → Data Mart pipeline using a banking domain as an example. This will help you understand how data flows from raw transactions to insightful business reports: 🏦 Banking Domain: End-to-End Data Pipeline 🎯 Use Case: A bank wants to: Monitor real-time transactions (fraud detection, customer support). Store transactions in a Data Warehouse for compliance and auditing. Provide reports to analysts on customer spending behavior, product trends, etc. ✅ Pipeline Overview ┌────────────┐ │ OLTP Apps │ ← Customer actions (withdraw, deposit, login, etc.) └────┬───────┘ ▼ ┌───────────────────┐ │ Kafka (Streaming) │ ← Captures transactions in real-time └─────┬─────────────┘ ▼ ┌─────────────────────┐ │ ODS (PostgreSQL/MongoDB) │ ← Stores current state (e.g., latest balances) └─────┬─────────────────┘ ▼ ┌────────────────────────────┐ │ Data Lake / Data Warehouse │ ← Stores historical transactions (batch load) └──────┬─────────────────────┘ ▼ ┌─────────────────────┐"></li><li class="carousel-slide" data-ssplayer-slide-index="22" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/23/1753755501432?e=1754524800&amp;v=beta&amp;t=ERbJVwv-R9UX2tf0MgSFU4J4exditiXOEoGePsZAcg8" alt="│ Data Marts │ ← Specific reporting needs (Sales, Loans, Risk) └────────┬────────────┘ ▼ BI Tools (Tableau, Power BI) 🔹 Kafka Layer (Real-time ingestion) Producers: Core banking system, online banking app Topic: transactions_topic Message Format: { &quot;account_id&quot;: &quot;12345&quot;, &quot;txn_type&quot;: &quot;withdrawal&quot;, &quot;amount&quot;: 10000, &quot;timestamp&quot;: &quot;2025-07-27T15:45:30&quot; } Kafka Connect: Sends data to ODS in PostgreSQL or MongoDB 🔸 ODS Layer (Current state) Table: ods_account_balance account_id | current_balance | last_txn_time -----------|-----------------|--------------- 12345 | 25000 | 2025-07-27 15:45:30 Used For: Call center staff checking current balance Real-time fraud detection (flagging large/irregular transactions) 🔸 Data Warehouse Layer (Batch ETL) ETL Tool: Apache NiFi / Airflow / Spark ETL Target: fact_transactions (historical) txn_id | account_id | txn_type | amount | txn_time"></li><li class="carousel-slide" data-ssplayer-slide-index="23" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/24/1753755501432?e=1754524800&amp;v=beta&amp;t=R6OcO_wd2j__huOUsfecuESCVCa00oMDRuHHuCX550k" alt="-------|------------|-----------|--------|------------------ TXN001 | 12345 | withdrawal| 10000 | 2025-07-27 15:45 TXN002 | 67890 | deposit | 15000 | 2025-07-27 16:10 Used For: Auditing Aggregated reports 🔸 Data Mart Layer (Business analytics) Example: Loan Performance Mart Fact Table: fact_loan_payments Dimensions: dim_customer, dim_branch, dim_date Query: Total EMI payments by region SELECT b.region, d.month, SUM(f.payment_amount) AS total_emi FROM fact_loan_payments f JOIN dim_branch b ON f.branch_id = b.branch_id JOIN dim_date d ON f.date_id = d.date_id GROUP BY b.region, d.month; 📊 Used for branch performance analysis, loan product optimization 🧠 Summary Flow:"></li><li class="carousel-slide" data-ssplayer-slide-index="24" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/25/1753755501432?e=1754524800&amp;v=beta&amp;t=2Sf2SdieeDypolplDaFIZhK11RWN8sRFdGZAFjDV6uE" alt="Stage Purpose Tech Stack Kafka (Streaming) Real-time ingestion Kafka, Kafka Connect, Flink/Spark ODS Real-time operational reporting PostgreSQL, MongoDB, MySQL Data Warehouse Long-term historical storage Hive, Snowflake, Redshift, BigQuery Data Mart Department-specific analytics Star Schema in OLAP systems BI Layer Dashboards &amp; Reports Power BI, Tableau, Superset 🧠 What is a Slowly Changing Dimension (SCD)? A Slowly Changing Dimension is a dimension table where attribute values change slowly over time, and we need to track these changes in some way for historical accuracy or reporting. 📌 Example: A customer changes their address, or an employee changes their department. 📚 Types of Slowly Changing Dimensions"></li><li class="carousel-slide" data-ssplayer-slide-index="25" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/26/1753755501432?e=1754524800&amp;v=beta&amp;t=VsmyTbzlZR_qZA7reNYJLmd15TOqcU_3p-ZChwqfgcQ" alt="Type Description Keeps History? Real-Life Example Type 0 Retain original data (no change tracking) ❌ No Birthdate, SSN Type 1 Overwrite old data with new data ❌ No Correcting a misspelled name Type 2 Add a new row with versioning ✅ Yes Customer moved to new city Type 3 Add new column for previous value ✅ Partial Track current and previous department Type 4 History table separate from current ✅ Yes Historical salary records stored in a separate table Type 6 Hybrid of Types 1, 2, and 3 ✅ Yes Combines full row history + current &amp; previous values ✅ Let’s explore each with examples: 🔵 Type 0 – Fixed Dimension 🧾 Use Case: Some data should never change once set. Example: dim_employee emp_id emp_name date_of_birth 101 Alice 1990-01-01 Even if the employee claims a new DOB, it is ignored — no changes allowed."></li><li class="carousel-slide" data-ssplayer-slide-index="26" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/27/1753755501432?e=1754524800&amp;v=beta&amp;t=MrLPDn0Qzb1wmjpx0_aLNIu4hPWzLHpEm3vRiXa3Yl4" alt="🔵 Type 1 – Overwrite (No History) 🧾 Use Case: Minor corrections (e.g., spelling errors) Before: customer_id customer_name city 201 Jon Smith Delhi After Correction: UPDATE dim_customer SET customer_name = &#39;John Smith&#39;, city = &#39;Mumbai&#39; WHERE customer_id = 201; Result: customer_id customer_name city 201 John Smith Mumbai 🔁 Old data is lost; good for correcting wrong values. 🔵 Type 2 – Row Versioning (Track Full History) ✅ Most used 🧾 Use Case: Need to maintain historical trail. Before (original record): emp_id emp_name dept start_date end_date is_current 501 Raj HR 2023-01-01 NULL Y After department change to &quot;Finance&quot;: -- Mark old record as inactive"></li><li class="carousel-slide" data-ssplayer-slide-index="27" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/28/1753755501432?e=1754524800&amp;v=beta&amp;t=QQRfxTPH0zFlG6mwBSetL59InOJFeG6GoPwKM7YMX2o" alt="UPDATE dim_employee SET end_date = &#39;2024-03-31&#39;, is_current = &#39;N&#39; WHERE emp_id = 501 AND is_current = &#39;Y&#39;; -- Insert new record INSERT INTO dim_employee (emp_id, emp_name, dept, start_date, end_date, is_current) VALUES (501, &#39;Raj&#39;, &#39;Finance&#39;, &#39;2024-04-01&#39;, NULL, &#39;Y&#39;); Result: emp_id emp_name dept start_date end_date is_current 501 Raj HR 2023-01-01 2024-03-31 N 501 Raj Finance 2024-04-01 NULL Y 🧠 Keeps full history, useful for time-based reports. 🔵 Type 3 – Add Column for Previous Value 🧾 Use Case: Track limited history (only one previous value) Table: dim_employee emp_id emp_name current_dept previous_dept 301 Rani IT HR 🧠 You can only track one historical change (not multiple changes). 🔵 Type 4 – History Table (Separate) 🧾 Use Case: Keep current values in main table; history in a separate one. Table: dim_customer_current"></li><li class="carousel-slide" data-ssplayer-slide-index="28" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/29/1753755501432?e=1754524800&amp;v=beta&amp;t=gCBDioA3CIR0KRlr2xzlLhljChr9joE1VO8wsFC1OCs" alt="cust_id name status 401 Vijay Active Table: dim_customer_history cust_id name status change_date 401 Vijay Inactive 2023-12-01 401 Vijay Active 2024-01-01 🗃️ History is maintained in a dedicated table. 🔵 Type 6 – Hybrid (Type 1 + 2 + 3) 🧾 Use Case: Need to have current value, history tracking, and previous value Table: dim_employee emp_id emp_name current_dep t prev_dept start_date end_date is_current 601 Anita Sales HR 2024-05-01 NULL Y Combines: Type 1 (overwrite some attributes), Type 2 (row versioning), Type 3 (previous column) Complex but very powerful for complete historical tracking. ✅ Which SCD Type to Choose?"></li><li class="carousel-slide" data-ssplayer-slide-index="29" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/30/1753755501432?e=1754524800&amp;v=beta&amp;t=hqqcgynHcPQm75isg_PzajDScLyGN-noVciqWiMvLQ8" alt="Use Case SCD Type Correct a typo Type 1 Track every change historically Type 2 Track only one previous change Type 3 Need separate table for history Type 4 Full audit trail + previous column Type 6 Value should never change Type 0 💬 Summary: SCD Type Overwrite History Extra Table Complexity Usage Type 0 Yes No No Low Rare (static) Type 1 Yes No No Low Common Type 2 No Yes No Medium Very Common Type 3 No Partial No Low Rare Type 4 No Yes Yes Medium Niche Type 6 No Yes No High Advanced Below are SQL scripts for implementing each Slowly Changing Dimension (SCD) Type with sample tables and updates. We&#39;ll use a common example of a Customer Dimension Table. 🏷️ Base Table: dim_customer"></li><li class="carousel-slide" data-ssplayer-slide-index="30" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/31/1753755501432?e=1754524800&amp;v=beta&amp;t=pGHlB0w0MAElH3XFYRXsRACMcVHXCeEyx5GE1bIDSHg" alt="Column Description customer_id Business key customer_name Name of customer city Customer&#39;s city ... Other dimension attributes 🔵 SCD Type 1: Overwrite (No History) ✅ Use Case: Minor correction (e.g., city correction) -- Suppose customer moves from Delhi to Mumbai UPDATE dim_customer SET city = &#39;Mumbai&#39; WHERE customer_id = 101; ✅ Old value is lost — simple overwrite. 🔵 SCD Type 2: Full History with Row Versioning ✅ Use Case: Track all changes with start_date, end_date, is_current 🛠 Step 1: Table with SCD Type 2 structure CREATE TABLE dim_customer ( surrogate_key INT IDENTITY(1,1) PRIMARY KEY, customer_id INT, customer_name VARCHAR(100), city VARCHAR(50), start_date DATE, end_date DATE, is_current CHAR(1)"></li><li class="carousel-slide" data-ssplayer-slide-index="31" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/32/1753755501432?e=1754524800&amp;v=beta&amp;t=u8vLwn5-Y7fgumaJsf4SzsS-6ddXu3LX5Dvat57pdmU" alt="); 🛠 Step 2: Update logic when city changes -- Mark old record as inactive UPDATE dim_customer SET end_date = &#39;2024-07-26&#39;, is_current = &#39;N&#39; WHERE customer_id = 101 AND is_current = &#39;Y&#39;; -- Insert new record INSERT INTO dim_customer (customer_id, customer_name, city, start_date, end_date, is_current) VALUES (101, &#39;John Doe&#39;, &#39;Mumbai&#39;, &#39;2024-07-27&#39;, NULL, &#39;Y&#39;); ✅ Keeps complete history with versions. 🔵 SCD Type 3: Add Column for Previous Value ✅ Use Case: Store current and previous city (limited history) 🛠 Step 1: Create Table CREATE TABLE dim_customer ( customer_id INT PRIMARY KEY, customer_name VARCHAR(100), current_city VARCHAR(50), previous_city VARCHAR(50) ); 🛠 Step 2: Update logic when city changes -- Move current_city to previous_city and update new city UPDATE dim_customer SET previous_city = current_city, current_city = &#39;Mumbai&#39;"></li><li class="carousel-slide" data-ssplayer-slide-index="32" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/33/1753755501432?e=1754524800&amp;v=beta&amp;t=uV1G08BEoQAK9rx9oJmBZTe33GXiryCYG1JyBMccaWc" alt="WHERE customer_id = 101; ✅ Stores one previous value, no row versioning. 🔵 SCD Type 4: Separate History Table ✅ Use Case: Maintain history in a different table 🛠 Step 1: Current Table CREATE TABLE dim_customer_current ( customer_id INT PRIMARY KEY, customer_name VARCHAR(100), city VARCHAR(50) ); 🛠 Step 2: History Table CREATE TABLE dim_customer_history ( customer_id INT, customer_name VARCHAR(100), city VARCHAR(50), change_date DATE ); 🛠 Step 3: On change, move to history and update current -- Insert old data to history INSERT INTO dim_customer_history (customer_id, customer_name, city, change_date) SELECT customer_id, customer_name, city, GETDATE() FROM dim_customer_current WHERE customer_id = 101; -- Update current table"></li><li class="carousel-slide" data-ssplayer-slide-index="33" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/34/1753755501432?e=1754524800&amp;v=beta&amp;t=tPvn98Xan33_mJkhpZEUouyjIlQxv6YZlb_qKdmR0ZA" alt="UPDATE dim_customer_current SET city = &#39;Mumbai&#39; WHERE customer_id = 101; ✅ History maintained separately. 🔵 SCD Type 6: Hybrid (Type 1 + 2 + 3) ✅ Use Case: Track all history with current &amp; previous values in same row 🛠 Table Definition: CREATE TABLE dim_customer ( surrogate_key INT IDENTITY(1,1) PRIMARY KEY, customer_id INT, customer_name VARCHAR(100), current_city VARCHAR(50), previous_city VARCHAR(50), start_date DATE, end_date DATE, is_current CHAR(1) ); 🛠 Update Logic (when city changes): -- Step 1: Mark old record as inactive UPDATE dim_customer SET end_date = &#39;2024-07-26&#39;, is_current = &#39;N&#39; WHERE customer_id = 101 AND is_current = &#39;Y&#39;; -- Step 2: Insert new record with previous city INSERT INTO dim_customer (customer_id, customer_name, current_city, previous_city, start_date, end_date, is_current)"></li><li class="carousel-slide" data-ssplayer-slide-index="34" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/35/1753755501432?e=1754524800&amp;v=beta&amp;t=o7XG2FxXU0pKN_yhm5Le3pHPrDrsuOVCh0Q04MTp26c" alt="VALUES (101, &#39;John Doe&#39;, &#39;Mumbai&#39;, &#39;Delhi&#39;, &#39;2024-07-27&#39;, NULL, &#39;Y&#39;); ✅ Combines row versioning (Type 2) + previous column (Type 3) + overwrite behavior. ✅ Summary Table SCD Type Tracks Full History Extra Columns Extra Table Example Use Case Type 1 ❌ No ❌ No ❌ No Fixing typos Type 2 ✅ Yes ✅ (row-level) ❌ No City or department changes Type 3 ❌ Partial (1 prev) ✅ Yes ❌ No Previous address Type 4 ✅ Yes ❌ No ✅ Yes Salary history, tracking status Type 6 ✅ Yes + current/prev ✅ Yes ❌ No Full hybrid tracking Example of how to implement Slowly Changing Dimension (SCD) Type 1 in Hive: 🧠 What is SCD Type 1 in Hive? Type 1 simply overwrites old dimension data with new data — no history is maintained. Common use case: Correcting spelling errors or changes where history is not important. 📘 Example Use Case: dim_customer Assume we are maintaining a Customer Dimension with the following columns: customer_id (business key) customer_name city last_updated_date Step-by-Step Guide"></li><li class="carousel-slide" data-ssplayer-slide-index="35" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/36/1753755501432?e=1754524800&amp;v=beta&amp;t=j_L0X1piR4LYSPS3XA7xaENhkdRTbu573Cg-i0Mygoo" alt="✅ Step 1: Create the Hive Dimension Table CREATE TABLE dim_customer ( customer_id INT, customer_name STRING, city STRING, last_updated_date DATE ) STORED AS ORC; ✅ Step 2: Load Initial Data into dim_customer INSERT INTO dim_customer VALUES (101, &#39;John Smith&#39;, &#39;Delhi&#39;, &#39;2024-07-01&#39;), (102, &#39;Alice Jones&#39;, &#39;Mumbai&#39;, &#39;2024-07-01&#39;); ✅ Step 3: Create a Staging Table for New Data This staging table simulates new or updated records coming in from a source system. CREATE TABLE staging_customer ( customer_id INT, customer_name STRING, city STRING, last_updated_date DATE ) STORED AS ORC; ✅ Step 4: Load Updated Data into staging_customer Suppose customer 101 moved from Delhi to Bangalore: INSERT INTO staging_customer VALUES (101, &#39;John Smith&#39;, &#39;Bangalore&#39;, &#39;2024-07-27&#39;); ✅ Step 5: Perform SCD Type 1 Merge (Overwrite)"></li><li class="carousel-slide" data-ssplayer-slide-index="36" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/37/1753755501432?e=1754524800&amp;v=beta&amp;t=tVMfp94EY6u1mt3QXQMOZOdpQYgdGRBaf3C3O2ZC0bM" alt="In Hive, you simulate a merge (upsert) using: INSERT OVERWRITE (with left join + coalesce) Or MERGE in Hive 2.2+ with ACID tables (if enabled) We&#39;ll do a traditional Type 1 logic with overwrite: Option 1: Using INSERT OVERWRITE + UNION -- Step 1: Create temp table to hold merged data CREATE TABLE dim_customer_updated AS SELECT COALESCE(sc.customer_id, dc.customer_id) AS customer_id, COALESCE(sc.customer_name, dc.customer_name) AS customer_name, COALESCE(sc.city, dc.city) AS city, COALESCE(sc.last_updated_date, dc.last_updated_date) AS last_updated_date FROM dim_customer dc LEFT JOIN staging_customer sc ON dc.customer_id = sc.customer_id UNION ALL -- New customers only in staging SELECT sc.customer_id, sc.customer_name, sc.city, sc.last_updated_date FROM staging_customer sc LEFT JOIN dim_customer dc"></li><li class="carousel-slide" data-ssplayer-slide-index="37" tabindex="-1" aria-hidden="true" style="width: 508px; height: 718px;"><img class="carousel-lazy-element carousel-slide-is-portrait" data-src="https://media.licdn.com/dms/image/v2/D561FAQEm9KUB3NSDrw/feedshare-document-images_1280/B56ZhT.TiWHQAw-/38/1753755501432?e=1754524800&amp;v=beta&amp;t=kgcs1Yag3bwZEBFh2sk8iNWNxsVzZOnEXuOw-CBCHzE" alt="ON sc.customer_id = dc.customer_id WHERE dc.customer_id IS NULL; Step 2: Overwrite the original dimension table INSERT OVERWRITE TABLE dim_customer SELECT * FROM dim_customer_updated; ✅ Final Output in dim_customer customer_id customer_name city last_updated_date 101 John Smith Bangalore 2024-07-27 102 Alice Jones Mumbai 2024-07-01 ✅ The city for customer 101 is updated (overwritten) — no history retained. ✅ Summary of Hive SCD Type 1 Implementation Step Description 1 Create dimension and staging tables 2 Load new/updated data into staging 3 Perform left join + coalesce logic 4 Use INSERT OVERWRITE to update target"></li></ul></div>
